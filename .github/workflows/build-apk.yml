name: build-apk

# Builds the Android APK for Mario Kart World (0400C3F00006E000) and uploads it
# as a workflow artifact. No game code or game data is in the repo or the APK:
# the pack is still made on the phone from the user's own dump.
#
# Two upstream assumptions are patched for a Linux runner below:
#   * android/ondevice/build.sh hard-codes the NDK's darwin-x86_64 llvm-strip
#   * it calls `shasum`, which GitHub's Ubuntu image does not ship

on:
  workflow_dispatch:
  push:
    branches: [ android ]

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
      # 120 s instead of the default 10 s: the runner's route to services.gradle.org
      # and Maven Central is the flakiest part of this job
      GRADLE_OPTS: -Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf "$ANDROID_SDK_ROOT/emulator" "$ANDROID_SDK_ROOT/system-images" || true
          df -h /

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: .NET 10 (NativeAOT translator)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The wrapper downloads its Gradle distribution on first use, and that
      # download is a single request with a 10 s socket timeout: on a bad runner
      # day it times out and the whole job dies before a line of code runs
      # ("Downloading gradle-8.14.3-bin.zip failed: timeout (10000ms)").
      # This action fetches the version the wrapper names itself, caches it
      # between runs, and the two timeouts below give the network room.
      - name: Gradle (cached, with the wrapper's version)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Install SDK packages
        run: |
          # Not android-actions/setup-android: it insists on installing the
          # legacy "tools" package, which current SDK images no longer publish
          # ("Failed to find package 'tools'"), and the whole job dies there.
          # The runner image already has cmdline-tools, so drive sdkmanager.
          SDKM=$(ls "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | tail -1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" \
                  "ndk;28.2.13676358" "cmake;3.22.1"
          echo "--- ndk ---"; ls "$ANDROID_SDK_ROOT/ndk"
          echo "--- cmake ---"; ls "$ANDROID_SDK_ROOT/cmake"

      - name: Build deps, shasum shim, Linux port of build.sh
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh ninja-build cmake git curl zlib1g-dev
          sudo tee /usr/local/bin/shasum > /dev/null <<'EOF'
          #!/bin/sh
          [ "$1" = "-a" ] && [ "$2" = "256" ] && shift 2
          exec sha256sum "$@"
          EOF
          sudo chmod +x /usr/local/bin/shasum
          sed -i 's|\$NDK/toolchains/llvm/prebuilt/darwin-x86_64/bin/llvm-strip|\$BIN/llvm-strip|' \
            android/ondevice/build.sh
          grep -n llvm-strip android/ondevice/build.sh

      - name: Packer stage (CPython, capstone, lz4, translator, SPIRV-Tools)
        run: zsh android/ondevice/build.sh "$RUNNER_TEMP/packer"

      - name: Cache Gradle distribution
        id: gradle-dist-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/gradle-dist
          key: gradle-dist-8.14.3-bin

      - name: Pre-fetch Gradle 8.14.3 (services.gradle.org -> github.com returns 504)
        if: steps.gradle-dist-cache.outputs.cache-hit != 'true'
        run: |
          # Fixed official checksum of gradle-8.14.3-bin.zip: any mirror is safe to use
          SHA=bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531
          DIR="$RUNNER_TEMP/gradle-dist"; mkdir -p "$DIR"
          F="$DIR/gradle-8.14.3-bin.zip"
          for round in 1 2 3; do
            for url in \
              https://downloads.gradle.org/distributions/gradle-8.14.3-bin.zip \
              https://mirrors.cloud.tencent.com/gradle/gradle-8.14.3-bin.zip \
              https://services.gradle.org/distributions/gradle-8.14.3-bin.zip ; do
              echo "== $url (round $round)"
              rm -f "$F"
              if curl -fL --connect-timeout 20 --max-time 300 -o "$F" "$url" \
                 && echo "$SHA  $F" | sha256sum -c -; then
                echo "Gradle downloaded OK"; exit 0
              fi
            done
            sleep 30
          done
          echo "Could not download Gradle from any source"; exit 1

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: APK (Mario Kart World)
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/app/local.properties
          cd android/app
          # the runner reaches services.gradle.org slowly at times: the 10 s default is too short
          sed -i 's/^networkTimeout=.*/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties
          # use the pre-fetched, checksum-verified Gradle instead of downloading it again
          sed -i "s|^distributionUrl=.*|distributionUrl=file\\\\:$RUNNER_TEMP/gradle-dist/gradle-8.14.3-bin.zip|" gradle/wrapper/gradle-wrapper.properties
          echo "distributionSha256Sum=bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531" >> gradle/wrapper/gradle-wrapper.properties
          cat gradle/wrapper/gradle-wrapper.properties
          for i in 1 2 3 4; do
            ./gradlew --no-daemon \
              -PnxPackStage="$RUNNER_TEMP/packer/stage" \
              -PnxGames=0400C3F00006E000 \
              -PnxApp=mkw \
              apk && break
            echo "gradlew failed (attempt $i)"
            [ "$i" = 4 ] && exit 1
            sleep 30
          done
          ls -la out/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nxnative-android-mkw
          path: android/app/out/*.apk
          if-no-files-found: error
